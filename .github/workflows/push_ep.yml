name: Event Portal Self-Managed Config Push

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: 'Application name in Event Portal'
        required: true
      application_domain_id:
        description: 'Application Domain ID'
        required: true

env:
  SOLACE_CLOUD_API_BASE: https://api.solace.cloud/api/v2/architecture
  SOLACE_CLOUD_API_TOKEN: ${{ secrets.SOLACE_CLOUD_API_TOKEN }}

jobs:
  deploy-event-portal-config:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba


      # --- Step 1: Get the Application ID ---
      - name: Get Application ID
        id: get_app_id
        run: |
          RESPONSE=$(curl -s -X GET \
            "${{ env.SOLACE_CLOUD_API_BASE }}/applications?name=${{ inputs.application_name }}&applicationDomainId=${{ inputs.application_domain_id }}" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json")
          APP_ID=$(echo $RESPONSE | jq -r '.data[0].id')
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT

      # --- Step 2: Get the Configuration Push Job ID ---
      - name: Get Configuration Push Job ID
        id: get_job_id
        run: |
          RESPONSE=$(curl -s -X GET \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applications/${{ steps.get_app_id.outputs.app_id }}/configurationPushJobs?pageSize=20&pageNumber=1&statuses=pending" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json")
          # Get the most recent job (first in list)
          echo $RESPONSE
          JOB_ID=$(echo $RESPONSE | jq -r '.data[0].id')
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT

      # --- Step 3: Fetch Terraform HCL Configuration ---
      - name: Fetch Terraform HCL Config
        id: fetch_config
        run: |
          RESPONSE=$(curl -s -X GET \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applicationConfigurationPushJobs/${{ steps.get_job_id.outputs.job_id }}/decryptedConfigurations?format=hcl" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json")
          # Get the data
          echo $RESPONSE
          HCL=$(echo $RESPONSE | jq -r '.data.hclConfigurations')
          echo "$HCL" >> broker_config.tf            
          cat -n  broker_config.tf

      # --- Step 4: Apply Terraform Configuration ---
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform  # your Terraform directory

      - name: Generate Terraform Plan
        run:  |
          cp ../broker_config.tf ./ 
          terraform plan -input=false -out=tfplan 
          ls -las
          cat -n  tfplan
        working-directory: ./terraform
        env:
          # Add your broker credentials as secrets
          TF_VAR_broker_url: ${{ secrets.BROKER_URL }}
          TF_VAR_broker_username: ${{ secrets.BROKER_USERNAME }}
          TF_VAR_broker_password: ${{ secrets.BROKER_PASSWORD }}          

      - name: Terraform Apply
        run: |
          terraform apply -input=false -auto-approve
        working-directory: ./terraform
        env:
          # Add your broker credentials as secrets
          TF_VAR_broker_url: ${{ secrets.BROKER_URL }}
          TF_VAR_broker_username: ${{ secrets.BROKER_USERNAME }}
          TF_VAR_broker_password: ${{ secrets.BROKER_PASSWORD }}

      # --- Step 5: Update Status in Event Portal ---
      - name: Mark Push Job as Complete in Event Portal
        if: success()
        run: |
          curl -s -X PATCH \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applicationConfigurationPushJobs/${{ steps.get_job_id.outputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "success"}'

      - name: Mark Push Job as Failed in Event Portal
        if: failure()
        run: |
          curl -s -X PATCH \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applicationConfigurationPushJobs/${{ steps.get_job_id.outputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "failure"}'