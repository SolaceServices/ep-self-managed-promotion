name: Event Portal Self-Managed Config Push
run-name: Deploy to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The environment to deploy the application to"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - test
          - production
      # TODO: check for application version
      application_name:
        description: 'Application name in Event Portal'
        required: true
        default: 'EmployeeLifecycleManager'
        type: string
      #application_domain_name:
      #  description: 'Application Domain Name'
      #  required: false
      #  default: 'ajcr-Human Capital Management Events'
      #  type: string
      application_domain_id:
        description: 'Application Domain ID'
        default: '3j896ggpxon'
        required: true
concurrency:
  group: ci-solace-ep-deployment
  cancel-in-progress: true
env:
  # the name of the environment you will deploy to, defaulting to test
  ENV_NAME: ${{ inputs.environment || 'development'}}
  APP_NAME: ${{ inputs.application_name }}
  ACTIONS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}
  AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
  SOLACE_CLOUD_API_BASE: https://api.solace.cloud/api/v2/architecture
  SOLACE_CLOUD_API_TOKEN: ${{ secrets.SOLACE_CLOUD_API_TOKEN }}
  TF_LOG: 'DEBUG'
  SOLACEBROKER_RETRIES: 1
  SOLACEBROKER_REQUEST_TIMEOUT_DURATION: 11m

permissions:
  id-token: write     # lets the job request the OIDC token
  contents: write     # still needed for actions/checkout

jobs:
  deploy-event-portal-config:
    runs-on: ubuntu-latest
    # This maps to the Environments tab in the GitHub UI
    # and scopes secrets and variables to that environment
    environment: ${{ inputs.environment || 'development' }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Get CLI
        working-directory: ./scripts
        run: python solace_batch_cli_execution.py -H ajcr-sandbox01.messaging.solace.cloud -u mission-control-manager -p v9nerdn7h0uah26hbqfc35csqg -vpn sandbox

      - name: Prepare deployment to ${{ env.ENV_NAME }} environment
        id: setup
        run: |
          echo "Deploying EP application: ${{ env.APP_NAME }} to $ENV_NAME"
          url=${{ secrets.BROKER_URL }}
          #
          # 1. Strip the protocol (removes everything up to and including '://')
          temp="${url#*://}"
          # 2. Strip the path, query, and fragment (removes everything from the first '/', '?', or '#')
          temp="${temp%%[/?#]*}"
          # 3. Strip the port number (removes everything from the first ':')
          hostname="${temp%%:*}"
          # echo "$hostname"
          # Output: sub.example.com
          TERRAFORM_FOLDER="./solace/$ENV_NAME/$APP_NAME"
          mkdir -p $TERRAFORM_FOLDER
          cp ./terraform/terraform-backend.tf $TERRAFORM_FOLDER
          cp ./terraform/.gitignore $TERRAFORM_FOLDER
          echo "TERRAFORM_FOLDER=$TERRAFORM_FOLDER" >> $GITHUB_OUTPUT        

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba

      - name: Show OIDC claims
        if: ${{ vars.ACTIONS_STEP_DEBUG == 'true' }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          #
          # decode the middle part (the payload) of the JWT
          payload=$(cut -d. -f2 <<< "$TOKEN" | tr '_-' '/+')
          # restore base64 padding
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload+="="; done
          base64 -d <<< "$payload" | jq '{iss, aud, sub, repository, ref, environment, job_workflow_ref}'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Additional steps
        run: |
          # Your commands that require AWS credentials
          aws sts get-caller-identity

      # --- Step 1: Get the Application ID ---
      - name: Get Application ID
        id: get_app_id
        run: |
          RESPONSE=$(curl -s -X GET \
            "${{ env.SOLACE_CLOUD_API_BASE }}/applications?name=${{ inputs.application_name }}&applicationDomainId=${{ inputs.application_domain_id }}" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json")
          APP_ID=$(echo $RESPONSE | jq -r '.data[0].id')
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT

      # --- Step 2: Get the Configuration Push Job ID ---
      - name: Get Configuration Push Job ID
        id: get_job_id
        run: |
          RESPONSE=$(curl -s -X GET \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applications/${{ steps.get_app_id.outputs.app_id }}/configurationPushJobs?pageSize=100&pageNumber=1&statuses=pending" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json")
          # Get the most recent job (first in list)
          echo $RESPONSE
          NO_JOB_ID='false'
          # if jq -e '.data | length == 0' <<< "$RESPONSE" > /dev/null; then
          #  echo "Application ${{ inputs.application_name  }} has no pending Jobs, aborting"
          #  NO_JOB_ID='true'
          #  return 2
          #fi
          #JOB_ID=$(echo $RESPONSE | jq -r '.data[0].id')
          
          ID=$(jq -r --arg broker "$MESH_BROKER_ID" \
           '[.data[] | select(.eventBrokerId == $broker) | .id] | first // empty' <<< "$RESPONSE")
          #
          [ -n "$ID" ] || { 
            echo "Application ${{ inputs.application_name  }} has no pending Jobs for broker: $MESH_BROKER_ID, aborting"
            NO_JOB_ID='true'
            return 2
          }
          #
          echo "JobId: $ID"
          #
          echo "job_id=$ID" >> $GITHUB_OUTPUT
          echo "no_job_id=$NO_JOB_ID" >> $GITHUB_OUTPUT
        env:
          MESH_BROKER_ID: ${{ vars.MESH_BROKER_ID }}

      # --- Step 3: Fetch Terraform HCL Configuration ---
      - name: Fetch Terraform HCL Config
        id: fetch_config
        working-directory: ${{ steps.setup.outputs.TERRAFORM_FOLDER }}
        run: |
          RESPONSE=$(curl -s -X GET \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applicationConfigurationPushJobs/${{ steps.get_job_id.outputs.job_id }}/decryptedConfigurations?format=hcl" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json")
          # Get the data
          
          #
          if [[ "$ACTIONS_STEP_DEBUG" == "true" ]]; then
            echo $RESPONSE
          fi          
          #
          # Getting the env variables!
          while read -r key b64; do
            value=$(printf '%s' "$b64" | base64 -d)
            {
             echo "TF_VAR_${key}<<EOF_${key}"
             echo "${value}"
             echo "EOF_${key}"
           } >> "$GITHUB_ENV"
           done < <(jq -r '.data.environmentVariables | to_entries[] | "\(.key) \(.value | @base64)"' <<< "$RESPONSE")
          #
          HCL=$(echo $RESPONSE | jq -r '.data.hclConfigurations')
          # delete the file
          rm -f application_config.tf
          # create the new file
          echo "$HCL" >> application_config.tf        
          #
          if [[ "$ACTIONS_STEP_DEBUG" == "true" ]]; then
            cat -n application_config.tf
          fi

      - name: Show GITHUB_ENV
        run: cat "$GITHUB_ENV"

      # --- Step 4: Apply Terraform Configuration ---
      - name: Terraform Init
        run: |
          #
          terraform init \
            -backend-config="bucket=$AWS_BUCKET_NAME" \
            -backend-config="key=solace/$ENV_NAME/$APP_NAME/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

        working-directory: ${{ steps.setup.outputs.TERRAFORM_FOLDER }}
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          APP_NAME: ${{ env.APP_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          TF_VAR_url: ${{ secrets.BROKER_URL }}
          TF_VAR_username: ${{ secrets.BROKER_USERNAME }}
          TF_VAR_password: ${{ secrets.BROKER_PASSWORD }}       


      - name: Generate Terraform Plan
        run:  |
          terraform plan -input=false -out=tfplan 
          ls -las
        working-directory: ${{ steps.setup.outputs.TERRAFORM_FOLDER }}
        env:
          TF_VAR_url: ${{ secrets.BROKER_URL }}
          TF_VAR_username: ${{ secrets.BROKER_USERNAME }}
          TF_VAR_password: ${{ secrets.BROKER_PASSWORD }}          

      - name: Terraform Apply
        run: |
          curl -s -X PUT \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applicationConfigurationPushJobs/${{ steps.get_job_id.outputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "in_progress"}'
          #
           terraform apply -input=false -auto-approve tfplan
        working-directory: ${{ steps.setup.outputs.TERRAFORM_FOLDER }}
        env:
          # Add your broker credentials as secrets
          #AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_url: ${{ secrets.BROKER_URL }}
          TF_VAR_username: ${{ secrets.BROKER_USERNAME }}
          TF_VAR_password: ${{ secrets.BROKER_PASSWORD }}          

      - name: Commit and push
        id: commit-and-push
        if: ${{ success() && steps.get_job_id.outputs.no_job_id  == 'false' }}
        working-directory: ${{ steps.setup.outputs.TERRAFORM_FOLDER }}
        run: |
         date -u > last-run.txt
         #
         git config user.name  "github-actions[bot]"
         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         # add required files - app, .gitignore and last run
         git add application_config.tf
         git add last-run.txt
         # make sure we dont upload the unnecessary files 
         git add .gitignore
         git rm -r --cached .terraform 2>/dev/null || true
         git rm --cached -- *.tfstate *.tfstate.* 2>/dev/null || true
         #
         if git diff --cached --quiet; then
           echo "Nothing to commit"
         else
           git commit -m "Update generated files after deployment"
           git push
         fi

      # --- Step 5: Update Status in Event Portal ---
      - name: Mark Push Job as Complete in Event Portal
        if: ${{ success() && steps.get_job_id.outputs.no_job_id  == 'false' }}
        run: |
            curl -s -X PUT \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applicationConfigurationPushJobs/${{ steps.get_job_id.outputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "success"}'            

      - name: Mark Push Job as Failed in Event Portal
        if: ${{ failure() && steps.get_job_id.outputs.no_job_id  == 'false' }}
        run: |
          curl -s -X PUT \
            "${{ env.SOLACE_CLOUD_API_BASE }}/runtimeManagement/applicationConfigurationPushJobs/${{ steps.get_job_id.outputs.job_id }}/status" \
            -H "Authorization: Bearer ${{ env.SOLACE_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "error"}'