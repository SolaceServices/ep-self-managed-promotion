name: Backup Cloud Broker (CLI)
on:
  schedule:
    # 22:10 NY, everyday
    - cron: '50 21 * * 0-6'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      manual:
        description: 'Manual run?'
        required: false
        default: true
        type: boolean

permissions:
  # id-token: write
  # needed for actions/checkout
  contents: write
  issues: write

concurrency:
  group: ci-solace-backup_broker
  cancel-in-progress: true
jobs:
  solace-cloud-services-terraform-backup:
    name: backup solace cloud
    runs-on: ubuntu-latest
    env:
      RUN_TYPE: ${{ inputs.manual || false }}
      SOLACECLOUD_API_TOKEN: ${{ secrets.SOLACE_CLOUD_API_TOKEN }}
      SOLACE_CLOUD_SERVICES: ${{ vars.SOLACE_CLOUD_SERVICES }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          # caches pip downloads between runs
          cache: pip

      - name: Install python script dependencies
        working-directory: ./scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Get Solace Cloud Backup - manual-process='${{env.RUN_TYPE}}'"
        working-directory: ./scripts
        run: |
            python solace_generate_cloud_backup.py --services="$SOLACE_CLOUD_SERVICES"
            #
            current_dir=$(pwd)
            echo "Current dir: $current_dir"
            ls -las
            # See the contents in debug mode
            if [[ "$ACTIONS_STEP_DEBUG" == "true" ]]; then
              for f in *.tf; do
                  echo "=== $f ==="
                  cat "$f"
                  echo
              done
            fi
            #

      - name: Move files
        run: |
            current_dir=$(pwd)
            mkdir -v -p $current_dir/$BACKUP_FOLDER
            ls -las $current_dir/$BACKUP_FOLDER          
            ls -las $current_dir/scripts 
            ls -las $current_dir/$BACKUP_FOLDER
            mv $current_dir/scripts/output.cli $current_dir/$BACKUP_FOLDER/broker.cli
            mv $current_dir/scripts/output.err.cli $current_dir/$BACKUP_FOLDER/broker.err.cli

      - name: Commit and push
        id: commit-and-push
        if: ${{ success() }}
        working-directory: "./${{ env.BACKUP_FOLDER }}"
        run: |
         #
         git config user.name  "github-actions[bot]"
         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         # add required files - app, .gitignore and last run
         git update-ref -d refs/remotes/origin/${{ github.ref_name }}
         git pull
         git add broker.cli
         git add broker.err.cli
         #
         if git diff --cached --quiet; then
           echo "Nothing to commit"
         else
           git commit -m "Update generated backup files"
           git push
         fi