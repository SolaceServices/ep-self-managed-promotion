name: Backup Message Vpns
on:
  schedule:
    # 22:00 NY, everyday
    - cron: '0 22 * * 0-6'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      manual:
        description: 'Manual run?'
        required: false
        default: true
        type: boolean

permissions:
  # id-token: write
  # needed for actions/checkout
  contents: write
  issues: write

concurrency:
  group: ci-solace-backup
  cancel-in-progress: true
jobs:
  cli-backup-message-vpn:
    name: backup ${{ matrix.env }} / ${{ matrix.msg-vpn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [development] #, test, production]
        msg-vpn: [sandbox] # message-vpns to use
    environment: ${{ matrix.env }}
    env:
      ENV_NAME: ${{ matrix.env }}
      MSG_VPN: ${{ matrix.msg-vpn }}
      RUN_TYPE: ${{ inputs.manual || false }}
      BACKUP_FOLDER: 'solace/${{ matrix.env }}/message-vpn/${{matrix.msg-vpn}}'
      BACKUP_SOLACE_BROKER_HOSTNAME: ${{ secrets.BACKUP_SOLACE_BROKER_HOSTNAME }}
      BACKUP_SOLACE_BROKER_PORT: ${{ secrets.BACKUP_SOLACE_BROKER_PORT }}
      # read-only SEMP user
      BACKUP_SOLACE_BROKER_USERNAME: ${{ secrets.BACKUP_SOLACE_BROKER_USERNAME }}
      BACKUP_SOLACE_BROKER_PASSWORD: ${{ secrets.BACKUP_SOLACE_BROKER_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          # caches pip downloads between runs
          cache: pip

      - name: Install python script dependencies
        working-directory: ./scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Get CLI environment='${{ env.ENV_NAME }}' - message-vpn='${{env.MSG_VPN}} - manual-process='${{env.RUN_TYPE}}'"
        working-directory: ./scripts
        run: |
            python solace_batch_cli_execution.py -H $BACKUP_SOLACE_BROKER_HOSTNAME -P $BACKUP_SOLACE_BROKER_PORT -u $BACKUP_SOLACE_BROKER_USERNAME -x $BACKUP_SOLACE_BROKER_PASSWORD -v $MSG_VPN
            # Test "output.cli" file
            file="output.cli"
            if [ ! -e "$file" ]; then
              echo "Backup $file does not exist."
              exit 1
            elif [ ! -s "$file" ]; then
                echo "Backup $file is empty."
                exit 1
            fi          
            # Test "output.err.cli" file
            file="output.err.cli"
            if [ -s "$file" ]; then
                echo "Backup $file is empty."
                exit 1
            fi   
            #
            current_dir=$(pwd)
            echo "Current dir: $current_dir"
            ls -las
            # See the contents in debug mode
            if [[ "$ACTIONS_STEP_DEBUG" == "true" ]]; then
              cat -n output.cli
              cat -n output.err.cli
            fi
            #

      - name: Move files
        run: |
            current_dir=$(pwd)
            mkdir -v -p $current_dir/$BACKUP_FOLDER
            ls -las $current_dir/$BACKUP_FOLDER          
            ls -las $current_dir/scripts 
            ls -las $current_dir/$BACKUP_FOLDER
            mv $current_dir/scripts/output.cli $current_dir/$BACKUP_FOLDER/$MSG_VPN.cli
            mv $current_dir/scripts/output.err.cli $current_dir/$BACKUP_FOLDER/$MSG_VPN.err.cli

      - name: Commit and push
        id: commit-and-push
        if: ${{ success() }}
        working-directory: "./${{ env.BACKUP_FOLDER }}"
        run: |
         date -u > last-run.txt
         #
         git config user.name  "github-actions[bot]"
         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         # add required files - app, .gitignore and last run
         git add $MSG_VPN.cli
         git add $MSG_VPN.err.cli
         git add last-run.txt
         #
         if git diff --cached --quiet; then
           echo "Nothing to commit"
         else
           git commit -m "Update generated backup files"
           git push
         fi

  cli-backup-service:
    name: backup ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [development] #, test, production]
    environment: ${{ matrix.env }}
    env:
      ENV_NAME: ${{ matrix.env }}
      MSG_VPN: '*'
      RUN_TYPE: ${{ inputs.manual || false }}
      BACKUP_FOLDER: 'solace/${{ matrix.env }}'
      BACKUP_SOLACE_BROKER_HOSTNAME: ${{ secrets.BACKUP_SOLACE_BROKER_HOSTNAME }}
      BACKUP_SOLACE_BROKER_PORT: ${{ secrets.BACKUP_SOLACE_BROKER_PORT }}
      # read-only SEMP user
      BACKUP_SOLACE_BROKER_USERNAME: ${{ secrets.BACKUP_SOLACE_BROKER_USERNAME }}
      BACKUP_SOLACE_BROKER_PASSWORD: ${{ secrets.BACKUP_SOLACE_BROKER_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          # caches pip downloads between runs
          cache: pip

      - name: Install python script dependencies
        working-directory: ./scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Get CLI environment='${{ env.ENV_NAME }}' - manual-process='${{env.RUN_TYPE}}'"
        working-directory: ./scripts
        run: |
            python solace_batch_cli_execution.py -H $BACKUP_SOLACE_BROKER_HOSTNAME -P $BACKUP_SOLACE_BROKER_PORT -u $BACKUP_SOLACE_BROKER_USERNAME -x $BACKUP_SOLACE_BROKER_PASSWORD -v $MSG_VPN
            # Test "output.cli" file
            file="output.cli"
            if [ ! -e "$file" ]; then
              echo "Backup $file does not exist."
              exit 1
            elif [ ! -s "$file" ]; then
                echo "Backup $file is empty."
                exit 1
            fi          
            # Test "output.err.cli" file
            file="output.err.cli"
            if [ -s "$file" ]; then
                echo "Backup $file is empty."
                exit 1
            fi   
            #
            current_dir=$(pwd)
            echo "Current dir: $current_dir"
            ls -las
            # See the contents in debug mode
            if [[ "$ACTIONS_STEP_DEBUG" == "true" ]]; then
              cat -n output.cli
              cat -n output.err.cli
            fi
            #

      - name: Move files
        run: |
            current_dir=$(pwd)
            mkdir -v -p $current_dir/$BACKUP_FOLDER
            ls -las $current_dir/$BACKUP_FOLDER          
            ls -las $current_dir/scripts 
            ls -las $current_dir/$BACKUP_FOLDER
            mv $current_dir/scripts/output.cli $current_dir/$BACKUP_FOLDER/broker.cli
            mv $current_dir/scripts/output.err.cli $current_dir/$BACKUP_FOLDER/broker.err.cli

      - name: Commit and push
        id: commit-and-push
        if: ${{ success() }}
        working-directory: "./${{ env.BACKUP_FOLDER }}"
        run: |
         date -u > last-run.txt
         #
         git config user.name  "github-actions[bot]"
         git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
         # add required files - app, .gitignore and last run
         git add broker.cli
         git add broker.err.cli
         git add last-run.txt
         #
         if git diff --cached --quiet; then
           echo "Nothing to commit"
         else
           git commit -m "Update generated backup files"
           git push
         fi